[package]
name = "bentopdf-desktop"
version = "2.8.10"
description = "BentoPDF desktop app for macOS"
authors = ["BentoPDF contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/uniuninaruru/bentopdf"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bentopdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
